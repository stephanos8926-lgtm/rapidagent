name: Dependabot

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trigger Dependabot
        uses: docker://ghcr.io/dependabot/dependabot-updater:latest
        with:
          args: --version 3.1.0
