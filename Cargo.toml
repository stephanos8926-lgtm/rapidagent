[workspace]
members = [
    "crates/core",
    "crates/ir",
    "crates/renderer",
    "crates/versioning",
    "crates/security",
    "crates/ml-eval",
    "crates/python",
    "crates/cli",
]
default-members = ["crates/core", "crates/ir", "crates/renderer", "crates/versioning", "crates/security", "crates/cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["RapidWebs Enterprise"]
repository = "https://github.com/RapidWebs-Enterprise/rapidagent"
readme = "README.md"
description = "The RapidAgent Runtime Framework — compiler, engine, and agent orchestration"

[workspace.dependencies]
# CLI
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Parser
nom = "7"
regex = "1"

# Security
sha2 = "0.10"
sha1 = "0.10"
hex = "0.4"

# UUID
uuid = { version = "1", features = ["v5", "serde"] }

# ML / Eval (optional feature)
ndarray = "0.16"
rand = "0.8"

# Python bindings (optional, requires maturin)
pyo3 = { version = "0.23", features = ["extension-module"] }
maturin = "1"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Filesystem
walkdir = "2"
tempfile = "3"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
correctness = { level = "warn" }
suspicious = { level = "warn" }
perf = { level = "warn" }
style = { level = "warn" }
pedantic = { level = "warn" }
