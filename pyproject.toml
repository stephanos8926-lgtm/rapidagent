[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rapidagent"
version = "0.1.0"
description = "An innovative, efficient, and powerful AI Agent Framework by RapidWebs Enterprise"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "RapidWebs Enterprise", email = "contact@rapidwebs.org"},
]
keywords = ["ai", "agent", "framework", "llm", "enterprise"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "anthropic>=0.28.0",
    "google-generativeai>=0.6.0",
    "langchain-core>=0.2.0",
    "mcp>=1.0.0",
    "pydantic>=2.0.0",
    "tenacity>=8.0.0",
    "structlog>=24.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.0",
]
test = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
]
lint = [
    "ruff>=0.4.0",
    "mypy>=1.0",
]

[tool.hatch.version]
path = "src/rapidagent/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/rapidagent"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
