[package]
name = "rapidagent-python"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Python bindings via PyO3"

[lib]
name = "syspro_compiler"
crate-type = ["cdylib"]

[dependencies]
rapidagent-core = { path = "../core" }
rapidagent-ir = { path = "../ir" }
rapidagent-renderer = { path = "../renderer" }
rapidagent-security = { path = "../security" }
pyo3 = { workspace = true, features = ["extension-module"] }
serde = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
