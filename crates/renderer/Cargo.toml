[package]
name = "rapidagent-renderer"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Output renderers: XML, Markdown, JSON"

[dependencies]
rapidagent-ir = { path = "../ir" }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
uuid = { workspace = true, features = ["v5"] }
# serde_xml = { workspace = true }  # Uncomment when needed

[lints]
workspace = true
